name: Build avicii K3s kernel

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out control-plane repository
        uses: actions/checkout@v5

      - name: Load pinned build inputs
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source configs/kernel/build.env
          set +a
          env | grep -E '^(KERNEL_|CLANG_)' >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python2 \
            python3 \
            zip
          python2 --version

      - name: Fetch pinned kernel source
        shell: bash
        run: |
          set -euo pipefail
          git init kernel
          git -C kernel remote add origin "$KERNEL_REPOSITORY"
          git -C kernel fetch --depth=1 origin "$KERNEL_COMMIT"
          git -C kernel checkout --detach FETCH_HEAD
          test "$(git -C kernel rev-parse HEAD)" = "$KERNEL_COMMIT"

      - name: Apply local kernel fixes
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r patch; do
            case "$patch" in
              ''|'#'*) continue ;;
            esac
            patch_path="$GITHUB_WORKSPACE/patches/kernel/$patch"
            test -f "$patch_path"
            git -C kernel apply --check "$patch_path"
            git -C kernel apply "$patch_path"
          done < patches/kernel/series

      - name: Restore Android Clang toolchain cache
        id: clang-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            kernel/clang-llvm
            ${{ env.CLANG_REVISION }}.tar.gz.sha256
          key: android-${{ env.CLANG_REVISION }}-${{ env.CLANG_ARCHIVE_SHA256 }}
          restore-keys: |
            android-clang-r530567-linux-x86-v1

      - name: Fetch Android Clang toolchain
        if: steps.clang-cache.outputs.cache-matched-key == ''
        shell: bash
        run: |
          set -euo pipefail

          archive="${CLANG_REVISION}.tar.gz"
          checksum_file="${archive}.sha256"
          downloaded=false

          for attempt in 1 2 3; do
            echo "Toolchain download attempt $attempt of 3"

            if curl \
              --fail \
              --location \
              --continue-at - \
              --retry 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 1800 \
              "$CLANG_ARCHIVE" \
              --output "$archive" \
              && gzip -t "$archive" \
              && tar -tzf "$archive" >/dev/null; then
              actual_sha="$(sha256sum "$archive" | awk '{print $1}')"
              if [[ "$actual_sha" == "$CLANG_ARCHIVE_SHA256" ]]; then
                downloaded=true
                break
              fi
              echo "Toolchain checksum mismatch"
              echo "Expected: $CLANG_ARCHIVE_SHA256"
              echo "Actual:   $actual_sha"
            fi

            echo "Downloaded archive was incomplete or invalid"
          done

          if [[ "$downloaded" != true ]]; then
            echo "Unable to download a valid Clang archive after 3 attempts"
            exit 1
          fi

          sha256sum "$archive" > "$checksum_file"
          mkdir -p kernel/clang-llvm
          tar -xzf "$archive" -C kernel/clang-llvm

      - name: Verify Android Clang toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -x kernel/clang-llvm/bin/clang
          checksum_file="${CLANG_REVISION}.tar.gz.sha256"
          test -s "$checksum_file"
          recorded_sha="$(awk '{print $1}' "$checksum_file")"
          test "$recorded_sha" = "$CLANG_ARCHIVE_SHA256"
          kernel/clang-llvm/bin/clang --version

      - name: Save Android Clang toolchain cache
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            kernel/clang-llvm
            ${{ env.CLANG_REVISION }}.tar.gz.sha256
          key: android-${{ env.CLANG_REVISION }}-${{ env.CLANG_ARCHIVE_SHA256 }}

      - name: Generate and verify kernel configuration
        shell: bash
        run: |
          set -euo pipefail
          make -s -C kernel ARCH=arm64 O=out \
            avicii_defconfig debugfs.config
          cp kernel/out/.config kernel/out/base.config

          KCONFIG_CONFIG="$PWD/kernel/out/.config" \
            kernel/scripts/kconfig/merge_config.sh -m \
            kernel/out/.config \
            "$GITHUB_WORKSPACE/configs/kernel/k3s.config"

          make -s -C kernel ARCH=arm64 O=out olddefconfig
          kernel/scripts/config --file kernel/out/.config \
            --set-str LOCALVERSION "$KERNEL_LOCALVERSION"
          kernel/scripts/config --file kernel/out/.config \
            --disable LOCALVERSION_AUTO
          make -s -C kernel ARCH=arm64 O=out olddefconfig

          while IFS= read -r requested; do
            case "$requested" in
              CONFIG_*=*) ;;
              *) continue ;;
            esac

            symbol="${requested%%=*}"
            actual="$(grep -E "^${symbol}=" kernel/out/.config || true)"
            if [[ "$actual" != "$requested" ]]; then
              echo "Configuration mismatch: requested '$requested', got '$actual'"
              exit 1
            fi
          done < configs/kernel/k3s.config

          grep -qx '# CONFIG_KSU is not set' kernel/out/.config

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export BRAND_SHOW_FLAG=oneplus
          export PATH="$PWD/kernel/clang-llvm/bin:$PATH"
          export CC="ccache clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1
          export DTC_EXT=/usr/bin/dtc

          make -C kernel ARCH=arm64 O=out -j"$(nproc)" \
            2>&1 | tee kernel-build.log

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: avicii-k3s-kernel-failure-log
          path: kernel-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect non-flashable audit artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp kernel/out/arch/arm64/boot/Image.gz-dtb dist/
          cp kernel/out/arch/arm64/boot/dtbo.img dist/dtbo-raw.img
          cp kernel/out/.config dist/kernel.config
          cp kernel-build.log dist/
          cp "${CLANG_REVISION}.tar.gz.sha256" dist/
          cp configs/kernel/build.env dist/
          cp configs/kernel/k3s.config dist/requested-k3s.config
          cp patches/kernel/series dist/PATCH_SERIES
          python2 kernel/scripts/diffconfig \
            kernel/out/base.config kernel/out/.config \
            > dist/base-to-final.diffconfig
          (
            cd patches/kernel
            while IFS= read -r patch; do
              case "$patch" in
                ''|'#'*) continue ;;
              esac
              sha256sum "$patch"
            done < series
          ) > "$GITHUB_WORKSPACE/dist/PATCHES.sha256"
          git -C kernel rev-parse HEAD > dist/SOURCE_COMMIT
          {
            printf 'manifest_format=1\n'
            printf 'kernel_build_version=%s\n' "$KERNEL_BUILD_VERSION"
            printf 'control_plane_commit=%s\n' "$GITHUB_SHA"
            printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'kernel_repository=%s\n' "$KERNEL_REPOSITORY"
            printf 'kernel_commit=%s\n' "$KERNEL_COMMIT"
            printf 'clang_revision=%s\n' "$CLANG_REVISION"
            printf 'clang_archive_sha256=%s\n' "$CLANG_ARCHIVE_SHA256"
            printf 'base_defconfigs=avicii_defconfig debugfs.config\n'
            printf 'kernel_localversion=%s\n' "$KERNEL_LOCALVERSION"
            printf 'requested_config_sha256=%s\n' \
              "$(sha256sum configs/kernel/k3s.config | awk '{print $1}')"
            printf 'patch_series_sha256=%s\n' \
              "$(sha256sum patches/kernel/series | awk '{print $1}')"
            printf 'final_config_sha256=%s\n' \
              "$(sha256sum dist/kernel.config | awk '{print $1}')"
            printf 'kernel_image_sha256=%s\n' \
              "$(sha256sum dist/Image.gz-dtb | awk '{print $1}')"
            printf 'dtbo_image_sha256=%s\n' \
              "$(sha256sum dist/dtbo-raw.img | awk '{print $1}')"
          } > dist/BUILD-MANIFEST.txt
          printf '%s\n' \
            'AUDIT ARTIFACTS ONLY.' \
            'Do not flash Image.gz-dtb or dtbo-raw.img directly.' \
            'A test boot image must be produced from the backed-up active boot image.' \
            > dist/DO-NOT-FLASH.txt
          (
            cd dist
            sha256sum \
              Image.gz-dtb \
              dtbo-raw.img \
              kernel.config \
              kernel-build.log \
              build.env \
              requested-k3s.config \
              PATCH_SERIES \
              PATCHES.sha256 \
              base-to-final.diffconfig \
              BUILD-MANIFEST.txt \
              "${CLANG_REVISION}.tar.gz.sha256" \
              SOURCE_COMMIT \
              DO-NOT-FLASH.txt \
              > SHA256SUMS
          )

      - name: Upload kernel audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: avicii-k3s-kernel
          path: dist/
          if-no-files-found: error
          retention-days: 14
